<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ungap Presenter · embed mock</title>
    <!--
      Embed mock for ungap Shell, step 1 (UNG-315). Served from this service's own origin, so the shell frames a real
      cross-origin page. Development only: the Vite build leaves it out unless EMBED_MOCK=1. Grows into the service's
      real embed mode (shell API, UNG-321).
    -->
    <style>
      :root { color-scheme: light dark; --ink: #1b2027; --ink-2: #5a6572; --bg: #f2f4f7; --line: #d7dde4; --accent: #1d4f96; }
      @media (prefers-color-scheme: dark) { :root { --ink: #e6e9ee; --ink-2: #9aa4b0; --bg: #1a1d23; --line: #2c313a; } }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
        font: 14px/1.45 Inter, system-ui, sans-serif; border-top: 3px solid var(--accent); }
      main { text-align: center; padding: 12px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      .surface { margin: 2px 0 10px; font-size: 15px; color: var(--accent); font-weight: 600; }
      dl { display: inline-grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0; font-size: 12.5px; text-align: left; color: var(--ink-2); }
      dt { text-align: right; }
      dd { margin: 0; font-family: ui-monospace, monospace; color: var(--ink); }
      body.strip main { display: flex; align-items: baseline; gap: 16px; }
      body.strip .surface { margin: 0; }
      body.strip dl { grid-template-columns: repeat(4, auto); }
    </style>
  </head>
  <body>
    <main>
      <h1>ungap Presenter</h1>
      <p class="surface" id="surface"></p>
      <dl>
        <dt>origin</dt><dd id="origin"></dd>
        <dt>framed by</dt><dd id="parent"></dd>
        <dt>shell</dt><dd id="shell"></dd>
        <dt>alive</dt><dd id="alive"></dd>
      </dl>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const surface = params.get('surface') || '(no surface)'
      document.getElementById('surface').textContent = surface
      document.getElementById('origin').textContent = location.origin
      const framed = window.top !== window
      const parent = location.ancestorOrigins && location.ancestorOrigins.length ? location.ancestorOrigins[0] : document.referrer ? new URL(document.referrer).origin : '?'
      document.getElementById('parent').textContent = framed ? parent : 'not framed'
      document.getElementById('shell').textContent = params.get('shell') || '–'
      if (surface === 'status') document.body.classList.add('strip')
      // Time since this page loaded: the shell must never reload a frame when the menu changes view.
      const started = Date.now()
      const alive = document.getElementById('alive')
      const tick = () => { const s = Math.floor((Date.now() - started) / 1000); alive.textContent = Math.floor(s / 60) + ' min ' + (s % 60) + ' s' }
      tick(); setInterval(tick, 1000)
    </script>
  </body>
</html>
