name: Deploy live-console-v3 to Scaleway

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://api.dev.live.ungap.net/api/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - uses: scaleway/action-scw@v0
        with:
          version: v2.62.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-organization-id: ${{ vars.SCW_ORGANIZATION_ID }}
          default-project-id: ${{ vars.SCW_PROJECT_ID }}
          save-config: true
      - name: Installera s3cmd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends s3cmd
      - name: Installera s3cmd-config
        run: yes | scw object config install type=s3cmd
      - name: Synka dist/ till bucketen
        # En bucket-policy på den här bucketen blockerar av okänd anledning
        # även den egna Applicationens skrivåtkomst (samma mönster gäller
        # INTE på manifest-bucketen i live-server-v3 med identisk policy —
        # bucket-specifik Scaleway-kvirk, upptäckt 2026-09-15, aldrig
        # förklarad). Ta bort policyn, synka, sätt tillbaka — sajten är
        # otillgänglig i någon sekund per deploy, en accepterad kompromiss.
        # --no-mime-magic: s3cmds innehålls-sniffing gissar fel content-type
        # för .css (blir text/plain) — extensionbaserad gissning är korrekt.
        # index.html/rot-filer får no-cache (namnet ändras aldrig, måste alltid
        # kunna peka på nya hashade filnamn); assets/* är innehålls-hashade av
        # Vite och får därför cachas i ett år utan risk för inaktuellt innehåll.
        run: |
          s3cmd delpolicy s3://${{ vars.CONSOLE_BUCKET }} || true
          s3cmd sync --delete-removed --no-mime-magic \
            --exclude 'assets/*' \
            --add-header="Cache-Control: public, max-age=0, must-revalidate" \
            dist/ s3://${{ vars.CONSOLE_BUCKET }}/
          s3cmd sync --delete-removed --no-mime-magic \
            --add-header="Cache-Control: public, max-age=31536000, immutable" \
            dist/assets/ s3://${{ vars.CONSOLE_BUCKET }}/assets/
          s3cmd setpolicy deploy/bucket-policy.json s3://${{ vars.CONSOLE_BUCKET }}
      - name: Rensa CDN-cache
        run: |
          scw edge-services purge-request create \
            pipeline-id=${{ vars.CONSOLE_PIPELINE_ID }} all=true
