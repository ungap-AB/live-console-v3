<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namnlistor</title>
<style>
  :root{
    --ink:#1b2027; --ink-2:#5a6572; --ink-3:#8b95a1;
    --line:#d7dde4; --line-soft:#e8ecf1;
    --bg:#f2f4f7; --panel:#fff;
    --accent-soft:#eef1f5;
    --odm:#1d4f96; --odm-bg:#e9f0fb;
    --danger:#a51c1c;
    --focus:#2f6fd0;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .view{display:flex;flex-direction:column;height:100vh}
  .view > header{display:flex;align-items:center;gap:14px;flex:none;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  .view > header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
  .view > header .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .build{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:3px 8px}
  .view > .content{flex:1;padding:22px 26px;overflow:auto;min-height:0}

  .btn{border:1px solid var(--line);background:#fbfcfd;border-radius:6px;padding:7px 13px;font-weight:500;white-space:nowrap}
  .btn:hover:not(:disabled){background:#f1f4f8}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:5px 10px;font-size:13px}
  .btn-danger{color:var(--danger);border-color:#e5c4c4;background:#fdf6f6}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent}
  .tag.used{background:var(--odm-bg);color:var(--odm);border-color:#c6d8f0}
  .tag.free{background:#eef1f5;color:var(--ink-3);border-color:var(--line)}

  .split{display:grid;grid-template-columns:296px 1fr;gap:18px;height:100%;min-height:0}
  @media (max-width:980px){.split{grid-template-columns:1fr;height:auto}}

  .pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
  .pane .top{padding:12px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px}
  .search{flex:1;position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.7}
  .search input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px 7px 30px;background:#fbfcfd}
  .pane ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
  .pane li button{width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;display:block}
  .pane li button:hover{background:var(--accent-soft)}
  .pane li.sel button{background:#e6eaf0}
  .nm{font-weight:600;display:flex;align-items:center;gap:8px}
  .nm .dot{width:6px;height:6px;border-radius:50%;background:var(--odm);flex:none}
  .meta{font-size:12px;color:var(--ink-3);margin-top:1px}
  .pane .none{padding:22px 14px;text-align:center;color:var(--ink-3);font-size:13px}

  .doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
  .doc .head{padding:16px 20px 14px;border-bottom:1px solid var(--line-soft)}
  .doc h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em}
  .facts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--ink-3)}
  .tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .tools .spacer{flex:1}
  .doc .body{padding:14px 20px 20px;overflow:auto;flex:1}

  .filterbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;max-width:640px}
  .filterbar .search{max-width:260px}
  .filterbar .count{font-size:12.5px;color:var(--ink-3);margin-left:auto}

  ul.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-width:640px}
  ul.people li{display:flex;align-items:center;gap:11px;border:1px solid var(--line-soft);border-radius:8px;padding:8px 11px;background:#fff}
  ul.people li.dragging{opacity:.4}
  ul.people li.over{border-color:var(--focus);box-shadow:inset 0 2px 0 var(--focus)}
  .grip{color:var(--line);cursor:grab;font-size:15px;line-height:1;user-select:none;flex:none}
  .who{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-weight:400}
  .rowbtns{display:flex;gap:2px;flex:none}
  .ib{border:0;background:none;color:var(--ink-3);width:26px;height:26px;border-radius:5px;display:grid;place-items:center}
  .ib:hover{background:var(--accent-soft);color:var(--ink)}
  .ib.del:hover{background:#fdf0f0;color:var(--danger)}
  .ib svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .addrow{margin-top:10px;max-width:640px;display:flex;gap:8px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fbfcfd;max-width:320px}
  .hint{margin-top:16px;max-width:640px;padding:10px 13px;border-radius:7px;font-size:13px;background:#eef2f7;color:var(--ink-2);border:1px solid var(--line)}
  .docnone{height:100%;display:grid;place-items:center;color:var(--ink-3);padding:40px}
  .listempty{border:1px dashed var(--line);border-radius:8px;padding:26px;text-align:center;color:var(--ink-3);max-width:640px;font-size:13px}
</style>
</head>
<body>

<div class="view">
  <header>
    <div>
      <h1>Namnlistor</h1>
      <div class="sub">Mallar som kan läggas in i projekt</div>
    </div>
    <span class="build">fristående vy</span>
  </header>

  <div class="content">
    <div class="split">
      <section class="pane" aria-label="Namnlistor">
        <div class="top">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="q" type="search" placeholder="Sök namnlista" aria-label="Sök namnlista">
          </div>
          <button class="btn btn-sm" id="newList">Ny</button>
        </div>
        <ul id="list"></ul>
      </section>

      <section class="doc" id="doc" aria-label="Vald namnlista"></section>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- data ---- */
let lists = [
  { id:'n1', name:'Kommunfullmäktige 2026', desc:'Ledamöter och ersättare', changed:'9 sep 2026', usedIn:4,
    people:['Anders Mårtén','Camilla Kvartoft','Clara Mårtén','Majken Mårtén','Jana Banana',
            'Erik Sundell','Ingrid Blomkvist','Lars Öberg','Maria Hallgren','Nils Persson',
            'Sofia Lindqvist','Tomas Ek','Ulrika Nyberg','Viktor Sandell'] },
  { id:'n2', name:'Kommunstyrelsen', desc:'Ordinarie ledamöter', changed:'2 sep 2026', usedIn:6,
    people:['Anders Mårtén','Ingrid Blomkvist','Lars Öberg','Sofia Lindqvist','Tomas Ek'] },
  { id:'n3', name:'Presidiet', desc:'Ordförande och vice ordförande', changed:'30 aug 2026', usedIn:2,
    people:['Ingrid Blomkvist','Lars Öberg','Clara Mårtén'] },
  { id:'n4', name:'Styrelse Brf Eken', desc:'Inför årsstämman', changed:'21 aug 2026', usedIn:0,
    people:['Majken Mårtén','Nils Persson','Ulrika Nyberg'] },
];
let selId = 'n1', editIdx = null, query = '', inner = '';

const IB = {
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l.9 12h9.2l.9-12"/></svg>',
  ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"/></svg>',
  no:'<svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5"/><path d="M4 10h9a6 6 0 0 1 0 12h-2"/></svg>',
};

/* ---- vänsterlista ---- */
function paintList(){
  const q = query.trim().toLowerCase();
  const hits = lists.filter(l => !q || (l.name + ' ' + l.desc).toLowerCase().includes(q));
  $('#list').innerHTML = hits.length ? hits.map(l => `
    <li class="${l.id === selId ? 'sel' : ''}">
      <button data-pick="${l.id}">
        <span class="nm">${l.usedIn ? '<span class="dot" title="Används i projekt"></span>' : ''}${esc(l.name)}</span>
        <span class="meta">${l.people.length} namn · ändrad ${l.changed}</span>
      </button></li>`).join('')
    : '<li class="none">Ingen namnlista matchar sökningen.</li>';
}

/* ---- detalj ---- */
function paintDoc(){
  const l = lists.find(x => x.id === selId);
  const doc = $('#doc');
  if (!l){ doc.innerHTML = '<div class="docnone">Välj en namnlista i listan.</div>'; return; }

  const f = inner.trim().toLowerCase();
  const rows = l.people
    .map((p, i) => ({ p, i }))
    .filter(r => !f || r.p.toLowerCase().includes(f));

  doc.innerHTML = `
    <div class="head">
      <h2>${esc(l.name)}</h2>
      <div class="facts">
        <span>${esc(l.desc)}</span><span>${l.people.length} namn</span><span>Ändrad ${l.changed}</span>
        ${l.usedIn ? `<span class="tag used">Används i ${l.usedIn} projekt</span>` : `<span class="tag free">Används inte</span>`}
      </div>
      <div class="tools">
        <button class="btn btn-sm" data-act="rename">Byt namn</button>
        <button class="btn btn-sm" data-act="dup">Duplicera</button>
        <button class="btn btn-sm" data-act="sort" ${l.people.length < 2 ? 'disabled' : ''}>Sortera A–Ö</button>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-danger" data-act="trash">Flytta till papperskorgen</button>
      </div>
    </div>
    <div class="body">
      ${l.people.length ? `
        <div class="filterbar">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="inner" type="search" placeholder="Filtrera namn" aria-label="Filtrera namn" value="${esc(inner)}">
          </div>
          <span class="count">${f ? `${rows.length} av ${l.people.length}` : `${l.people.length} namn`}</span>
        </div>` : ''}

      ${l.people.length
        ? (rows.length
            ? `<ul class="people" id="people">${rows.map(r => r.i === editIdx ? rowEdit(r.p, r.i) : rowView(r.p, r.i, !f)).join('')}</ul>`
            : `<div class="listempty">Inget namn matchar filtret.</div>`)
        : `<div class="listempty">Listan är tom. Lägg till det första namnet nedan.</div>`}

      <div class="addrow">
        <input id="newName" placeholder="Nytt namn" aria-label="Nytt namn">
        <button class="btn btn-sm" data-act="add">Lägg till</button>
      </div>

      ${l.usedIn ? `<p class="hint">Ändringar slår igenom i projekt som ännu inte publicerats. Publicerade sändningar har en fryst kopia och påverkas inte.</p>` : ''}
    </div>`;
}

const rowView = (p, i, draggable) => `
  <li ${draggable ? 'draggable="true"' : ''} data-i="${i}">
    ${draggable ? '<span class="grip" aria-hidden="true">⠿</span>' : ''}
    <span class="who">${esc(p)}</span>
    <span class="rowbtns">
      <button class="ib" data-edit="${i}" title="Redigera" aria-label="Redigera">${IB.edit}</button>
      <button class="ib del" data-del="${i}" title="Ta bort" aria-label="Ta bort">${IB.del}</button>
    </span></li>`;

const rowEdit = (p, i) => `
  <li data-i="${i}">
    <span class="grip" aria-hidden="true">⠿</span>
    <span class="who"><input id="en" value="${esc(p)}" aria-label="Namn"></span>
    <span class="rowbtns">
      <button class="ib" data-save="${i}" title="Spara" aria-label="Spara">${IB.ok}</button>
      <button class="ib" data-cancel="1" title="Avbryt" aria-label="Avbryt">${IB.no}</button>
    </span></li>`;

const touch = l => { l.changed = 'idag'; };

/* ---- händelser ---- */
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick){ selId = pick.dataset.pick; editIdx = null; inner = ''; paintList(); paintDoc(); return; }

  if (e.target.closest('#newList')){
    const id = 'n' + Date.now();
    lists.unshift({ id, name:'Ny namnlista', desc:'Utkast', changed:'idag', usedIn:0, people:[] });
    selId = id; editIdx = null; query = ''; inner = ''; $('#q').value = ''; paintList(); paintDoc(); return;
  }

  const l = lists.find(x => x.id === selId);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act && l){
    if (act === 'add'){
      const v = $('#newName').value.trim();
      if (!v){ $('#newName').focus(); return; }
      l.people.push(v); touch(l); inner = ''; paintList(); paintDoc(); $('#newName').focus(); return;
    }
    if (act === 'sort'){ l.people.sort((a,b) => a.localeCompare(b,'sv')); touch(l); paintDoc(); return; }
    if (act === 'dup'){
      const c = JSON.parse(JSON.stringify(l));
      c.id = 'n'+Date.now(); c.name = l.name+' (kopia)'; c.usedIn = 0; c.changed = 'idag';
      lists.splice(lists.indexOf(l)+1, 0, c); selId = c.id; editIdx = null; inner = ''; paintList(); paintDoc(); return;
    }
    if (act === 'rename'){
      const n = prompt('Namn på namnlistan', l.name);
      if (n && n.trim()){ l.name = n.trim(); touch(l); paintList(); paintDoc(); }
      return;
    }
    if (act === 'trash'){
      if (l.usedIn && !confirm(`${l.name} används i ${l.usedIn} projekt. Flytta till papperskorgen ändå?`)) return;
      lists = lists.filter(x => x !== l);
      selId = lists[0]?.id ?? null; editIdx = null; inner = ''; paintList(); paintDoc(); return;
    }
  }
  if (!l) return;

  const ed = e.target.closest('[data-edit]');
  if (ed){ editIdx = +ed.dataset.edit; paintDoc(); $('#en')?.select(); return; }

  const sv = e.target.closest('[data-save]');
  if (sv){
    const v = $('#en').value.trim();
    if (!v){ $('#en').focus(); return; }
    l.people[+sv.dataset.save] = v; touch(l); editIdx = null; paintDoc(); return;
  }
  if (e.target.closest('[data-cancel]')){ editIdx = null; paintDoc(); return; }

  const dl = e.target.closest('[data-del]');
  if (dl){ l.people.splice(+dl.dataset.del, 1); touch(l); editIdx = null; paintList(); paintDoc(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q'){ query = e.target.value; paintList(); }
  if (e.target.id === 'inner'){
    inner = e.target.value;
    paintDoc();
    const box = $('#inner'); if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName'){ e.preventDefault(); document.querySelector('[data-act="add"]').click(); return; }
  if (editIdx === null) return;
  if (e.key === 'Enter'){ e.preventDefault(); $('[data-save]')?.click(); }
  if (e.key === 'Escape'){ editIdx = null; paintDoc(); }
});

/* ---- dra och släpp (endast utan filter, där ordningen är hela listan) ---- */
let from = null;
document.addEventListener('dragstart', e => {
  const li = e.target.closest('#people li'); if (!li) return;
  from = +li.dataset.i; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => {
  const li = e.target.closest('#people li'); if (!li || from === null) return;
  e.preventDefault();
  document.querySelectorAll('#people li').forEach(x => x.classList.remove('over'));
  li.classList.add('over');
});
document.addEventListener('drop', e => {
  const li = e.target.closest('#people li'); if (!li || from === null) return;
  e.preventDefault();
  const l = lists.find(x => x.id === selId);
  const [moved] = l.people.splice(from, 1);
  l.people.splice(+li.dataset.i, 0, moved);
  touch(l); from = null; editIdx = null; paintDoc();
});
document.addEventListener('dragend', () => {
  from = null;
  document.querySelectorAll('#people li').forEach(x => x.classList.remove('dragging','over'));
});

paintList();
paintDoc();
</script>
</body>
</html>
