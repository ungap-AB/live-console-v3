<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ungap – applikationsskal</title>
<style>
  :root{
    --ink:#1b2027; --ink-2:#5a6572; --ink-3:#8b95a1;
    --line:#d7dde4; --line-soft:#e8ecf1;
    --bg:#f2f4f7; --panel:#fff; --rail:#f7f9fb;
    --accent:#1b2027; --accent-soft:#eef1f5;
    --focus:#2f6fd0;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .shell{display:grid;grid-template-columns:232px 1fr;height:100vh}

  /* ---------- vänsterspalt ---------- */
  .rail{
    display:flex;flex-direction:column;
    background:var(--rail);border-right:1px solid var(--line);
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    padding:16px 16px 14px;border-bottom:1px solid var(--line-soft);
  }
  .brand .mark{
    width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;
    display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;
  }
  .brand .name{font-weight:600;letter-spacing:-.01em}
  .brand .name span{display:block;font-size:11px;font-weight:400;color:var(--ink-3);letter-spacing:0}

  nav{flex:1;overflow:auto;padding:10px 10px 16px}
  nav .group{
    font-size:11px;color:var(--ink-3);padding:12px 8px 5px;
  }
  nav a{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:7px;margin-bottom:1px;
    color:var(--ink-2);text-decoration:none;font-weight:500;
    position:relative;
  }
  nav a:hover{background:var(--accent-soft);color:var(--ink)}
  nav a[aria-current="page"]{background:#e6eaf0;color:var(--ink)}
  nav a[aria-current="page"]::before{
    content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;
    background:var(--accent);border-radius:0 3px 3px 0;
  }
  nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  nav a .count{
    margin-left:auto;font-size:11.5px;color:var(--ink-3);
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 6px;
  }

  .user{
    border-top:1px solid var(--line-soft);padding:12px 12px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;flex:none;
    background:#dde3ea;color:var(--ink-2);display:grid;place-items:center;
    font-size:12px;font-weight:600;
  }
  .user .who{min-width:0;flex:1}
  .user .who b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user .who span{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logout{
    border:1px solid var(--line);background:#fff;border-radius:6px;
    width:30px;height:30px;flex:none;display:grid;place-items:center;color:var(--ink-2);
  }
  .logout:hover{background:#fff0f0;border-color:#e5c4c4;color:#a51c1c}
  .logout svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- högerspalt ---------- */
  .detail{display:flex;flex-direction:column;min-width:0;overflow:auto}
  .detail header{
    display:flex;align-items:center;gap:14px;
    padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .detail header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
  .detail header .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
  .detail .canvas{flex:1;padding:26px}
  .placeholder{
    height:100%;min-height:300px;border:1px dashed var(--line);border-radius:10px;
    background:var(--panel);display:grid;place-items:center;color:var(--ink-3);
  }

  .menu-btn{display:none}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .rail{
      position:fixed;inset:0 auto 0 0;width:232px;z-index:20;
      transform:translateX(-100%);transition:transform .18s ease;
    }
    .rail.open{transform:none;box-shadow:0 0 40px rgba(10,14,20,.2)}
    .menu-btn{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px}
    .menu-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
  }
  @media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>
</head>
<body>
<div class="shell">

  <aside class="rail" id="rail">
    <div class="brand">
      <div class="mark">U</div>
      <div class="name">Ungap Live<span>Kalmar kommun</span></div>
    </div>

    <nav id="nav">
      <a href="#projekt"     data-view="Projekt" data-sub="Alla projekt" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Projekt <span class="count">12</span></a>

      <a href="#dagordningar" data-view="Dagordningar" data-sub="Mallar som kan läggas in i projekt">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 12h7M9 16h5M9 8h3"/></svg>
        Dagordningar</a>

      <a href="#namnlistor"  data-view="Namnlistor" data-sub="Mallar som kan läggas in i projekt">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 8h5M16 12h5M16 16h3"/></svg>
        Namnlistor</a>

      <div class="group">Sändning</div>

      <a href="#live"        data-view="Live" data-sub="Pågående och planerade sändningar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M6.5 7.5a7 7 0 0 0 0 9M17.5 7.5a7 7 0 0 1 0 9M3.8 4.5a11 11 0 0 0 0 15M20.2 4.5a11 11 0 0 1 0 15"/></svg>
        Live <span class="count">1</span></a>

      <a href="#videoarkiv"  data-view="Videoarkiv" data-sub="Publicerade och avslutade sändningar">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
        Videoarkiv</a>

      <div class="group">Administration</div>

      <a href="#papperskorg" data-view="Papperskorg" data-sub="Borttaget material">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M10 11v5M14 11v5"/></svg>
        Papperskorg</a>

      <a href="#anvandare"   data-view="Användare" data-sub="Behörigheter och konton">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19a6.2 6.2 0 0 1 12.4 0"/><circle cx="18" cy="9" r="2.4"/><path d="M16 19a5 5 0 0 1 5.2-4.6"/></svg>
        Användare</a>
    </nav>

    <div class="user">
      <div class="avatar">AM</div>
      <div class="who">
        <b>Anders Mårtén</b>
        <span>kalmar.se</span>
      </div>
      <button class="logout" title="Logga ut" aria-label="Logga ut">
        <svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M12 20H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg>
      </button>
    </div>
  </aside>

  <main class="detail">
    <header>
      <button class="menu-btn" id="menu-btn" aria-label="Visa meny">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <h1 id="view-title">Projekt</h1>
        <div class="sub" id="view-sub">Alla projekt</div>
      </div>
    </header>
    <div class="canvas">
      <div class="placeholder" id="placeholder">Projekt</div>
    </div>
  </main>
</div>

<script>
  const rail = document.getElementById('rail');
  const links = document.querySelectorAll('#nav a');

  function select(a){
    links.forEach(l => l.removeAttribute('aria-current'));
    a.setAttribute('aria-current', 'page');
    document.getElementById('view-title').textContent = a.dataset.view;
    document.getElementById('view-sub').textContent   = a.dataset.sub;
    document.getElementById('placeholder').textContent = a.dataset.view;
    document.title = a.dataset.view + ' – Ungap Live';
    rail.classList.remove('open');
  }

  links.forEach(a => a.addEventListener('click', e => { e.preventDefault(); select(a); location.hash = a.getAttribute('href').slice(1); }));

  const fromHash = () => {
    const a = [...links].find(l => l.getAttribute('href') === location.hash);
    if (a) select(a);
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();

  document.getElementById('menu-btn').onclick = () => rail.classList.toggle('open');
  document.querySelector('.logout').onclick = () => alert('Loggar ut Anders Mårtén (kalmar.se)');
</script>
</body>
</html>
